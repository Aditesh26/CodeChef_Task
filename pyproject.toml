[project]
name = "codechef-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditesh Patro", email = "aditeshpatro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncmy>=0.2.16",
    "fastapi[standard]>=0.143.2",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
codechef-task = "codechef_task:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
